# Optional alternative to `review hooks install`.
# Copy to the target repository root as lefthook.yml, then run `lefthook install`.
# Adjust commands to the project's real scripts.

pre-commit:
  parallel: false
  commands:
    format:
      run: npm run format:check
    lint:
      run: npm run lint

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm test -- --run
